<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-label="horos">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c232c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" rx="14" fill="#101418"/>
  <rect width="1280" height="300" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="13.5" fill="none" stroke="#2a333e"/>

  <!-- lockup: mark + wordmark, vertically centered -->
  <g transform="translate(104,94)">
    <g transform="scale(3.5)">
      <path d="M7 22 L7 9 Q7 7 9 7 L22 7" fill="none" stroke="#e6edf3"
            stroke-width="4.6" stroke-linecap="round"/>
      <rect x="17" y="17" width="9" height="9" rx="2.2" fill="#4dabf7"/>
    </g>
    <text x="146" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="88" font-weight="700" letter-spacing="2" fill="#e6edf3">horos</text>
  </g>

  <!-- the act of defining a boundary: the logo's corner drawn large,
       the rest of the region still dashed, a crosshair where it is being
       drawn, the accent block already anchored -->
  <g>
    <path d="M812 218 L812 92 Q812 74 830 74 L964 74" fill="none"
          stroke="#e6edf3" stroke-width="13" stroke-linecap="round"/>
    <path d="M964 74 L1130 74 Q1148 74 1148 92 L1148 128" fill="none"
          stroke="#3a4550" stroke-width="4" stroke-dasharray="2 18"
          stroke-linecap="round"/>
    <rect x="1102" y="172" width="52" height="52" rx="10" fill="#4dabf7"/>
    <!-- crosshair at the drawing point -->
    <g stroke="#4dabf7" stroke-width="2.5" stroke-linecap="round">
      <path d="M964 40 v22 M964 86 v22 M930 74 h22 M976 74 h22"/>
    </g>
    <circle cx="964" cy="74" r="4" fill="#4dabf7"/>
  </g>
</svg>
