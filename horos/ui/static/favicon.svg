<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- horos mark (Direction G): one boundary corner claims the region; the
       dark tile carries the canonical dark colorway onto any background -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#101418"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.08"/>
  <path d="M8 21.5 L8 10 Q8 8 10 8 L21.5 8" fill="none" stroke="#e6edf3"
        stroke-width="4" stroke-linecap="round"/>
  <rect x="17" y="17" width="8" height="8" rx="2" fill="#4dabf7"/>
</svg>
